name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional space-separated list of test files to run instead of the full suite'
        required: false
        default: ''
        type: string

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
    group: "${{ github.workflow }}-${{ github.event.pull_request.head.label || github.head_ref || github.ref }}"
    cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-regression-check-node10:
    name: Test compatibility with Node.js 10
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '10'
          cache: 'npm'
          cache-dependency-path: package.json
          check-latest: true

      - name: Pin the registry to the release date
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2026-05-05T08:31:31.849000Z

      - name: Install
        run: |
          npm install --ignore-scripts

      - name: Copy project as fast-uri to node_node_modules
        run: |
          rm -rf ./node_modules/fast-uri/lib &&
          rm -rf ./node_modules/fast-uri/index.js &&
          cp -r ./lib ./node_modules/fast-uri/lib &&
          cp ./index.js ./node_modules/fast-uri/index.js

      - name: Run tests
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npx tape ${{ inputs.test-filter }}
          else
            npm run test:unit
          fi
        env:
          NODE_OPTIONS: no-network-family-autoselection

  test-browser:
    name: Test browser compatibility
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'windows-latest', 'macos-latest']
        browser: ['chromium', 'firefox', 'webkit']
        exclude:
          - os: ubuntu-latest
            browser: webkit
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package.json
          check-latest: true

      - name: Pin the registry to the release date
        shell: bash
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2026-05-05T08:31:31.849000Z

      - name: Install dependencies
        run: |
          npm install --ignore-scripts

      - if: ${{ matrix.os == 'windows-latest' }}
        run: npx playwright install winldd

      - name: Run browser tests
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npx playwright-test ${{ inputs.test-filter }} --runner tape --browser=${{ matrix.browser }}
          else
            npm run test:browser:${{ matrix.browser }}
          fi

  test:
    name: Test
    needs:
      - test-regression-check-node10
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node-version: ['16', '18', '20', '22', '24']
        os: [macos-latest, ubuntu-latest, windows-latest]
        exclude:
          - os: macos-latest
            node-version: '16'
    steps:
      - name: Check out repo
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          check-latest: true
          node-version: ${{ matrix.node-version }}

      - name: Pin the registry to the release date
        shell: bash
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2026-05-05T08:31:31.849000Z

      - name: Install dependencies
        run: npm i --ignore-scripts

      - name: Run tests
        shell: bash
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npx tape ${{ inputs.test-filter }}
          else
            npm test
          fi

      - name: Pin npm to the version that packed the public tarball
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == '24' }}
        run: npm i -g npm@11.13.0

      - name: Pack the release tarball
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == '24' }}
        run: npm pack

      - name: Upload the release tarball
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node-version == '24' }}
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: fast-uri-*.tgz
          if-no-files-found: error
